# CI 에서는 application.yml(dev) 이 프로필과 무관하게 항상 로드되어 MySQL 전용 설정이 test 프로필까지 상속된다.
# H2 는 SET time_zone 문법을 모른다.
spring.datasource.hikari.connection-init-sql=
# 테스트가 jdbcTemplate 로 created_at 을 직접 쓰는 곳이 있어, JVM 타임존과 어긋나면 커서 경계가 깨진다.
# build.gradle 의 test task 가 JVM 을 Asia/Seoul 로 고정하므로 여기도 같은 값으로 맞춘다.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
